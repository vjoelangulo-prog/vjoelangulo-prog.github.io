<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070d"><script src="boot.js"></script><link rel="manifest" href="/manifest.json"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><title>Jarvis</title>
<style>
:root{--a:#19d3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% 42%,#0b1a2e,#04070d 72%);color:#cfe8ff;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/100% 4px,linear-gradient(90deg,#19d3ff12 1px,transparent 1px) 0 0/32px 100%;pointer-events:none}
#top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
#top b{color:var(--a);letter-spacing:5px;font-size:15px;text-shadow:0 0 12px var(--a)}
#top small{display:block;font-size:9px;color:#5b7a99;letter-spacing:2px;margin-top:2px}
.ib{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--a);background:#0a1626;color:var(--a);font-size:20px;box-shadow:0 0 14px #19d3ff33}
#gear{transition:transform .4s}#gear:active{transform:rotate(90deg)}
.dot:after{content:"";position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#ff4fd8;box-shadow:0 0 10px #ff4fd8}
.hb{background:#ffffff08;border:1px solid var(--a);color:var(--a);padding:9px 12px;font:11px ui-monospace,monospace;letter-spacing:2px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#core{--c:var(--a);position:relative;flex:1;display:flex;align-items:center;justify-content:center}
#core i{position:absolute;border-radius:50%;border:1px solid var(--c)}
#core .r1{width:min(86vw,330px);height:min(86vw,330px);border-style:dashed;opacity:.45;animation:rot 26s linear infinite}
#core .r2{width:min(72vw,278px);height:min(72vw,278px);border-width:2px;border-color:var(--c) transparent var(--c) transparent;animation:rot 7s linear infinite reverse}
#core .r3{width:min(58vw,226px);height:min(58vw,226px);border-width:3px;border-color:transparent var(--c) transparent var(--c);animation:rot 10s linear infinite;filter:drop-shadow(0 0 8px var(--c))}
#orb{width:min(34vw,136px);height:min(34vw,136px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 40%,#02101c);box-shadow:0 0 40px var(--c),0 0 110px var(--c);animation:idle 3s ease-in-out infinite}
#core.listening{--c:#2fffa0}#core.thinking{--c:#ffb02e}#core.speaking{--c:#ff4fd8}
#core.listening #orb{animation:pulse .7s ease-in-out infinite}
#core.thinking .r2,#core.thinking .r3{animation-duration:1.2s}
#core.speaking #orb{animation:talk .4s ease-in-out infinite}
#st{position:absolute;bottom:10px;font-size:11px;letter-spacing:3px;color:var(--c);text-align:center}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes idle{50%{transform:scale(1.07)}}@keyframes pulse{50%{transform:scale(1.28)}}@keyframes talk{50%{transform:scale(1.16)}}
#mainbar{display:flex;justify-content:space-around;align-items:center;padding:8px 24px calc(24px + env(safe-area-inset-bottom))}
#mic{width:78px;height:78px;font-size:32px;box-shadow:0 0 28px var(--a)}
.sp{width:46px}
.p{position:fixed;inset:0;background:#04070df7;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s;z-index:5}
.p.open{transform:none}
#pc{transform:translateX(100%)}#pc.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--a);color:var(--a);letter-spacing:3px;font-size:13px}
.cst{display:flex;align-items:center;font-size:10px;letter-spacing:2px}
#cd{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);margin-right:8px}
#cd.listening{background:#2fffa0;box-shadow:0 0 8px #2fffa0}#cd.thinking{background:#ffb02e;box-shadow:0 0 8px #ffb02e}#cd.speaking{background:#ff4fd8;box-shadow:0 0 8px #ff4fd8}
.sub{padding:7px 14px;font-size:9px;letter-spacing:3px;color:#5b7a99;border-bottom:1px solid #ffffff10;display:flex;justify-content:space-between}
#log{flex:1;overflow-y:auto;padding:6px 14px}
.msg{margin:14px 0;max-width:88%;animation:in .3s}
.msg.u{margin-left:auto}
.meta{display:flex;gap:10px;font-size:9px;letter-spacing:2px;color:#5b7a99;margin-bottom:5px}
.msg.u .meta{justify-content:flex-end}
.msg.j .meta span:first-child{color:var(--a)}.msg.u .meta span:first-child{color:#ff4fd8}
.bub{padding:11px 13px;font-size:14px;line-height:1.5;background:linear-gradient(135deg,#0d2036dd,#08121fdd);border:1px solid #1d3550;border-left:3px solid var(--a);border-radius:3px 12px 12px 12px;white-space:pre-wrap;word-wrap:break-word}
.msg.u .bub{border-left:1px solid #1d3550;border-right:3px solid #ff4fd8;border-radius:12px 3px 12px 12px}
.ty b{display:inline-block;width:7px;height:7px;margin:0 3px;border-radius:50%;background:var(--a);animation:bl 1s infinite}
.ty b:nth-child(2){animation-delay:.2s}.ty b:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#cbar{display:flex;gap:8px;padding:10px 12px calc(14px + env(safe-area-inset-bottom));align-items:center;border-top:1px solid #ffffff14;background:#060d17}
#txt{flex:1;min-width:0;background:#0a1626;border:1px solid #1d3550;border-radius:22px;color:#cfe8ff;padding:12px 16px;font:14px ui-monospace,monospace;outline:none}
#txt:focus{border-color:var(--a)}
#cbar .ib{width:44px;height:44px;flex:none;font-size:18px}
.tabs{display:flex;border-bottom:1px solid #ffffff18}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:#5b7a99;padding:13px 2px;font:10px ui-monospace,monospace;letter-spacing:1px}
.tabs button.on{color:var(--a);border-color:var(--a);text-shadow:0 0 8px var(--a)}
.pb{flex:1;overflow-y:auto;padding:14px}
.tp{display:none}.tp.on{display:block}
.row{margin-bottom:14px;background:#ffffff06;padding:10px;border-left:2px solid #1d3550}
.row label{display:block;font-size:10px;letter-spacing:2px;color:#5b7a99;margin-bottom:6px}
.row input[type=password],.row select{width:100%;background:#0a1626;border:1px solid #1d3550;color:#cfe8ff;padding:10px;font:13px ui-monospace,monospace}
.row input[type=range]{width:100%;accent-color:var(--a)}
.sw{display:flex;gap:14px}.sw span{width:36px;height:36px;border-radius:50%;border:2px solid #fff3}
#tree{width:100%;height:auto}
#tree text{font:11px ui-monospace,monospace;fill:#cfe8ff}
.add{display:flex;gap:6px;margin-top:14px}.add input,.add select{background:#0a1626;border:1px solid #1d3550;color:#cfe8ff;padding:9px;font:12px ui-monospace,monospace;min-width:0}.add input{flex:1}
</style></head><body>
<div id="top"><div><b>J.A.R.V.I.S</b><small>SISTEMA EN LINEA</small></div><button class="ib" id="gear" onclick="op()">⚙</button></div>
<div id="core"><i class="r1"></i><i class="r2"></i><i class="r3"></i><div id="orb"></div><div id="st"></div></div>
<div id="mainbar"><button class="ib" id="cb" onclick="oc()">💬</button><button class="ib" id="mic">🎤</button><div class="sp"></div></div>
<div class="p" id="pc"><div class="ph"><button class="hb" onclick="cc()">‹ VOLVER</button><span class="cst"><i id="cd"></i><span id="cs">EN ESPERA</span></span></div>
<div class="sub"><span>CANAL SEGURO // JARVIS</span><span>CIFRADO LOCAL</span></div>
<div id="log"></div>
<div id="cbar"><input id="txt" placeholder="Escribe un mensaje..."><button class="ib" id="cmic">🎤</button><button class="ib" id="send">➤</button></div></div>
<div class="p" id="ps"><div class="ph"><span>⚙ AJUSTES</span><button class="hb" onclick="cl()">X</button></div>
<div class="tabs"><button class="on" data-t="t1">MEMORIA</button><button data-t="t2">VOZ</button><button data-t="t3">IA</button><button data-t="t4">SISTEMA</button></div>
<div class="pb">
<div class="tp on" id="t1"><div id="ms" style="font-size:10px;color:#5b7a99;margin-bottom:8px"></div><div id="tw"></div><div class="add"><input id="nf" placeholder="nuevo recuerdo..."><select id="nc"></select><button class="hb" onclick="addF()">+</button></div></div>
<div class="tp" id="t2">
<div class="row"><label>VOZ</label><select id="vz"></select></div>
<div class="row"><label>VELOCIDAD</label><input type="range" id="rt" min="0.7" max="1.5" step="0.1"></div>
<div class="row"><label>TONO</label><input type="range" id="pt" min="0.5" max="1.5" step="0.1"></div>
<div class="row"><label>IDIOMA DE ESCUCHA</label><select id="lg"><option value="es-ES">Español (España)</option><option value="es-MX">Español (México)</option><option value="es-US">Español (EE.UU.)</option><option value="en-US">English</option></select></div>
<button class="hb" onclick="test()">PROBAR VOZ</button></div>
<div class="tp" id="t3">
<div class="row"><label>MODELO</label><select id="md"><option value="gemini-flash-lite-latest">Rápido (flash-lite)</option><option value="gemini-flash-latest">Más inteligente (flash)</option></select></div>
<div class="row"><label>LONGITUD DE RESPUESTAS</label><select id="ln"><option value="1">Breve</option><option value="2">Normal</option><option value="3">Detallada</option></select></div>
<div class="row"><label>APRENDER AUTOMATICAMENTE</label><select id="lr"><option value="1">Activado</option><option value="0">Desactivado</option></select></div></div>
<div class="tp" id="t4">
<div class="row"><label>API KEY GEMINI</label><input type="password" id="k"></div>
<div class="row"><label>COLOR DEL SISTEMA</label><div class="sw" id="sw"></div></div>
<button class="hb" onclick="clr()">BORRAR CHAT</button> <button class="hb" onclick="wipe()">BORRAR MEMORIA</button></div>
</div></div>
<script>
const $=i=>document.getElementById(i);
const CATS=['Trabajo','Gustos','Familia','Rutinas','Metas','Otros'];
const COL={Trabajo:'#19d3ff',Gustos:'#ff4fd8',Familia:'#ffb02e',Rutinas:'#2fffa0',Metas:'#a67bff',Otros:'#8fa6bf'};
const ld=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}};
let key=localStorage.jkey||'',hist=ld('jhist',[]),col=ld('jcol',[]),jlog=ld('jlog',[]),state='',rec=null;
let cfg=Object.assign({model:'gemini-flash-lite-latest',voice:'',rate:1,pitch:1,lang:'es-ES',len:'1',learn:'1',theme:'#19d3ff'},ld('jcfg',{}));
let facts=ld('jfacts',[]).map(f=>typeof f=='string'?{c:'Otros',t:f}:f);
const sv=()=>{localStorage.jcfg=JSON.stringify(cfg);localStorage.jfacts=JSON.stringify(facts);localStorage.jcol=JSON.stringify(col)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LEN={1:['máximo dos frases',300],2:['máximo cinco frases',600],3:['detallado pero claro',1200]};
function typing(on){const o=$('ty');if(o)o.remove();if(on){const d=document.createElement('div');d.id='ty';d.className='msg j';d.innerHTML='<div class="meta"><span>JARVIS</span></div><div class="bub ty"><b></b><b></b><b></b></div>';$('log').appendChild(d);$('log').scrollTop=1e9}}
function S(c,t){state=c;$('core').className=c;$('st').textContent=t;$('cs').textContent=t;$('cd').className=c;typing(c=='thinking')}
function add(w,t,ts,save){ts=ts||Date.now();const d=document.createElement('div');d.className='msg '+w;
const m=document.createElement('div');m.className='meta';
const a=document.createElement('span');a.textContent=w=='u'?'TÚ':'JARVIS';
const h=document.createElement('span');h.textContent=new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
m.append(a,h);const b=document.createElement('div');b.className='bub';b.textContent=t;d.append(m,b);$('log').appendChild(d);$('log').scrollTop=1e9;
if(save!==false){jlog.push({w,t,ts});localStorage.jlog=JSON.stringify(jlog.slice(-60));if(w=='j'&&!$('pc').classList.contains('open'))$('cb').classList.add('dot')}}
async function call(b){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+cfg.model+':generateContent',{method:'POST',headers:{'x-goog-api-key':key,'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error.message);return j.candidates[0].content.parts[0].text}
const sys=()=>'Eres Jarvis, un asistente personal por voz. Responde en español, '+LEN[cfg.len][0]+', natural, sin listas ni símbolos.'+(facts.length?' Lo que sabes del usuario: '+facts.map(f=>f.c+': '+f.t).join('; ')+'.':'');
async function learn(t){if(cfg.learn!='1')return;try{
const p='Recuerdos guardados: '+JSON.stringify(facts.map(f=>f.t))+'\nMensaje: '+t+'\nExtrae SOLO datos personales nuevos y permanentes del usuario. Categorías válidas: '+CATS.join(', ')+'. No repitas los guardados. Responde solo una lista JSON de objetos {"c":categoría,"t":frase corta en español}, o [] si no hay nada.';
const a=JSON.parse(await call({contents:[{role:'user',parts:[{text:p}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:400}}));
a.forEach(n=>{if(n&&n.t&&!facts.some(f=>f.t==n.t))facts.push({c:CATS.includes(n.c)?n.c:'Otros',t:String(n.t)})});sv();renderMem()}catch(e){}}
function speak(t){speechSynthesis.cancel();const p=t.split(/(?<=[.!?])\s+/).filter(x=>x.trim());let i=0;S('speaking','HABLANDO // TOCA PARA INTERRUMPIR');
const v=speechSynthesis.getVoices().find(v=>v.name==cfg.voice);
p.forEach(x=>{const u=new SpeechSynthesisUtterance(x);u.lang=cfg.lang;if(v)u.voice=v;u.rate=+cfg.rate;u.pitch=+cfg.pitch;u.onend=()=>{if(++i==p.length&&state=='speaking')S('','EN ESPERA')};speechSynthesis.speak(u)})}
async function send(t){t=(t||'').trim();if(!t)return;
if(!key){key=prompt('Pega tu API key de Gemini')||'';localStorage.jkey=key}
add('u',t);const l=t.toLowerCase();
if(l.startsWith('olvida todo')){hist=[];facts=[];localStorage.jhist='[]';sv();renderMem();add('j','Memoria borrada');S('','EN ESPERA');return}
if(l.startsWith('recuerda ')){facts.push({c:'Otros',t:t.slice(9)});sv();renderMem();add('j','Anotado');S('','EN ESPERA');return}
hist.push({role:'user',parts:[{text:t}]});S('thinking','PROCESANDO...');
try{let h=hist.slice(-40);while(h.length&&h[0].role!='user')h.shift();
const a=await call({systemInstruction:{parts:[{text:sys()}]},contents:h,generationConfig:{maxOutputTokens:LEN[cfg.len][1]}});
hist.push({role:'model',parts:[{text:a}]});localStorage.jhist=JSON.stringify(hist.slice(-40));add('j',a);speak(a);learn(t)}
catch(e){hist.pop();add('j','Error: '+e.message);S('','ERROR')}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){if(!SR){add('j','Usa Chrome para la voz');return}
rec=new SR();rec.lang=cfg.lang;rec.onstart=()=>S('listening','ESCUCHANDO...');
rec.onresult=e=>send(e.results[0][0].transcript);
rec.onerror=()=>S('','NO TE ENTENDI');
rec.onend=()=>{if(state=='listening')S('','EN ESPERA')};rec.start()}
function tap(){if(state=='speaking'||state=='listening'){speechSynthesis.cancel();if(rec)rec.abort();S('','EN ESPERA')}else if(state!='thinking')listen()}
$('mic').onclick=$('core').onclick=$('cmic').onclick=tap;
$('send').onclick=()=>{send($('txt').value);$('txt').value=''};
$('txt').onkeydown=e=>{if(e.key=='Enter'){send($('txt').value);$('txt').value=''}};
const op=()=>{$('ps').classList.add('open');renderMem()},cl=()=>$('ps').classList.remove('open');
const oc=()=>{$('pc').classList.add('open');$('cb').classList.remove('dot');$('log').scrollTop=1e9},cc=()=>$('pc').classList.remove('open');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.tp').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on')});
function tg(c){col=col.includes(c)?col.filter(x=>x!=c):col.concat(c);sv();renderMem()}
function del(i){if(confirm('Borrar: '+facts[i].t+'?')){facts.splice(i,1);sv();renderMem()}}
function addF(){const t=$('nf').value.trim();if(!t)return;facts.push({c:$('nc').value,t});$('nf').value='';sv();renderMem()}
function renderMem(){
const g=CATS.map(c=>({c,it:facts.map((f,i)=>({t:f.t,i,c:f.c})).filter(f=>f.c==c)})).filter(x=>x.it.length);
let y=18;g.forEach(x=>{x.o=!col.includes(x.c);x.ys=[];if(x.o)x.it.forEach(()=>{x.ys.push(y+14);y+=30});else{x.ys.push(y+14);y+=30}x.y=(x.ys[0]+x.ys[x.ys.length-1])/2;y+=8});
const H=Math.max(y,110),ry=g.length?(g[0].y+g[g.length-1].y)/2:H/2;
let s='<svg id="tree" viewBox="0 0 360 '+H+'"><defs><filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
g.forEach(x=>{const k=COL[x.c];
s+='<path d="M38 '+ry+'C52 '+ry+' 52 '+x.y+' 66 '+x.y+'" stroke="'+k+'" fill="none" opacity=".7" filter="url(#gl)"/>';
if(x.o)x.it.forEach((f,j)=>{const ly=x.ys[j];
s+='<path d="M142 '+x.y+'C157 '+x.y+' 157 '+ly+' 172 '+ly+'" stroke="'+k+'" fill="none" opacity=".5"/><g onclick="del('+f.i+')"><circle cx="172" cy="'+ly+'" r="4" fill="'+k+'" filter="url(#gl)"/><text x="182" y="'+(ly+4)+'">'+esc(f.t.length>28?f.t.slice(0,27)+'…':f.t)+'</text></g>'});
s+='<g onclick="tg(\''+x.c+'\')"><rect x="66" y="'+(x.y-12)+'" width="76" height="24" rx="12" fill="'+k+'22" stroke="'+k+'" filter="url(#gl)"/><text x="104" y="'+(x.y+4)+'" text-anchor="middle" style="fill:'+k+'">'+x.c+(x.o?'':' +'+x.it.length)+'</text></g>'});
s+='<circle cx="28" cy="'+ry+'" r="10" fill="'+cfg.theme+'" filter="url(#gl)"/><text x="28" y="'+(ry+24)+'" text-anchor="middle" style="fill:#5b7a99;font-size:9px">TU</text></svg>';
$('tw').innerHTML=g.length?s:'<p style="color:#5b7a99;font-size:12px">Sin recuerdos aún. Habla con Jarvis y se irán ramificando aquí.</p>';
$('ms').textContent=facts.length+' NODOS // '+g.length+' RAMAS // RAMA: PLEGAR // NODO: BORRAR'}
function theme(c){cfg.theme=c;document.documentElement.style.setProperty('--a',c);sv()}
function fill(){
$('nc').innerHTML=CATS.map(c=>'<option>'+c+'</option>').join('');
$('k').value=key;$('md').value=cfg.model;$('rt').value=cfg.rate;$('pt').value=cfg.pitch;$('lg').value=cfg.lang;$('ln').value=cfg.len;$('lr').value=cfg.learn;
const vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('es'));
$('vz').innerHTML='<option value="">Por defecto</option>'+vs.map(v=>'<option>'+esc(v.name)+'</option>').join('');$('vz').value=cfg.voice;
$('sw').innerHTML=['#19d3ff','#2fffa0','#a67bff','#ffb02e'].map(c=>'<span style="background:'+c+'" onclick="theme(\''+c+'\')"></span>').join('')}
['k','md','vz','rt','pt','lg','ln','lr'].forEach(i=>$(i).onchange=()=>{key=$('k').value.trim();localStorage.jkey=key;cfg.model=$('md').value;cfg.voice=$('vz').value;cfg.rate=$('rt').value;cfg.pitch=$('pt').value;cfg.lang=$('lg').value;cfg.len=$('ln').value;cfg.learn=$('lr').value;sv()});
function test(){speak('Hola, soy Jarvis. Así sueno con esta configuración.')}
function clr(){if(confirm('Borrar la conversación? La memoria se mantiene')){hist=[];jlog=[];localStorage.jhist='[]';localStorage.jlog='[]';$('log').innerHTML=''}}
function wipe(){if(confirm('Borrar TODA la memoria?')){facts=[];sv();renderMem()}}
speechSynthesis.onvoiceschanged=fill;fill();theme(cfg.theme);S('','TOCA PARA HABLAR');renderMem();
if(!jlog.length&&hist.length)jlog=hist.slice(-20).map(m=>({w:m.role=='user'?'u':'j',t:m.parts[0].text,ts:Date.now()}));
jlog.forEach(m=>add(m.w,m.t,m.ts,false));
</script><script src="extra.js"></script><script src="extra2.js"></script><script src="extra3.js"></script><script src="extra4.js"></script><script src="extra5.js"></script><script src="extra6.js"></script><script src="extra7.js"></script><script src="extra8.js"></script><script src="extra9.js"></script><script src="extra11.js"></script><script src="extra12.js"></script><script src="extra10.js"></script><script src="extra13.js"></script><script src="extra14.js"></script><script src="extra15.js"></script><script src="extra16.js"></script><script src="extra17.js"></script></body></html>
